version: "3.9"

services:
  pagoda-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagoda-ai-matching
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Hot reload in dev: mount source code
      # Comment this out in production
      - ./app:/service/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Optional: Nginx reverse proxy (uncomment for production)
